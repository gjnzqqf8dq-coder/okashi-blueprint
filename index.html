<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>おかしの設計図 / OKASHI BLUEPRINT</title>
<style>
:root{
  --ink:#0d1117; --sub:#6b7280; --line:rgba(13,30,60,.14);
  --accent:#0b57d0; --bg:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;cursor:crosshair}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;display:block;z-index:1}
#rvVid{position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none;z-index:-1}
/* 生成の最後に画面を覆う白。canvasではなくDOMに置くのは、上に載っている文字ごと隠すため */
#veil{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#fff;
  z-index:9;pointer-events:none;opacity:0}
/* 調整パネル（Pキーで開閉）。展示では使わない */
#tune{position:fixed;right:14px;top:14px;width:344px;max-height:94vh;overflow-y:auto;z-index:20;
  display:none;background:rgba(255,255,255,.97);border:1px solid #d7dbe2;border-radius:3px;
  padding:12px 14px 14px;font:11px/1.5 "SF Mono",ui-monospace,monospace;color:#2a3340;
  box-shadow:0 10px 40px -18px rgba(10,30,60,.5)}
#tune.on{display:block}
#tune h4{font-size:10px;letter-spacing:.18em;color:#8b93a1;margin:12px 0 5px;font-weight:400}
#tune h4:first-child{margin-top:0}
#tune .r{display:flex;align-items:center;gap:7px;margin:2px 0}
#tune .r span{flex:0 0 92px;font-size:10.5px}
#tune .r input{flex:1;height:2px;-webkit-appearance:none;background:#d7dbe2;outline:none}
#tune .r input::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
  background:#0b57d0;cursor:pointer}
#tune .r b{flex:0 0 52px;text-align:right;font-weight:400;color:#0b57d0}
#tune .tl{display:flex;align-items:center;gap:7px;margin-bottom:2px}
#tune .tl button{flex:0 0 34px;padding:4px 0;font-size:11px}
#tune .tl input{flex:1;height:2px;-webkit-appearance:none;background:#d7dbe2;outline:none}
#tune .tl input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
  background:#0b57d0;cursor:pointer}
#tune .tl b{flex:0 0 40px;text-align:right;font-weight:400;color:#0b57d0}
#tune .btns{display:flex;gap:6px;margin-top:12px}
#tune button{flex:1;font:inherit;font-size:10.5px;padding:7px 0;cursor:pointer;
  border:1px solid #c9ced6;background:#fff;border-radius:2px;color:#2a3340}
#tune button:hover{border-color:#0b57d0;color:#0b57d0}
#tune .note{font-size:9.5px;color:#8b93a1;margin-top:8px;line-height:1.6}
.mono{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}

/* ---------- 四隅のUI ---------- */
.hud{position:fixed;z-index:5;font-size:10.5px;letter-spacing:.16em;color:var(--sub);pointer-events:none}
.tl{top:22px;left:26px} .tr{top:22px;right:26px;text-align:right}
.bl{bottom:104px;left:26px} .br{bottom:104px;right:26px;text-align:right}
.hud b{display:block;color:var(--ink);font-size:12px;letter-spacing:.24em;margin-bottom:5px;font-weight:800}

/* ---------- 下部バー ---------- */
.cta{position:fixed;left:0;right:0;bottom:44px;z-index:6;display:flex;justify-content:center;pointer-events:none}
.cta button{pointer-events:auto;font:inherit;font-size:14px;letter-spacing:.26em;font-weight:700;color:var(--ink);
  background:none;border:none;padding:14px 6px 16px;cursor:pointer;position:relative}
.cta button::after{content:'';position:absolute;left:0;right:0;bottom:8px;height:1px;background:var(--ink);
  transform:scaleX(.28);transform-origin:center;transition:transform .7s cubic-bezier(.16,1,.3,1),opacity .4s}
.cta button:hover::after{transform:scaleX(1)}
/* 狭い画面：下端だとお菓子に埋もれる。中央に、押せると分かる程度のガラスの板で置く */
@media(max-width:820px){
  .cta{top:0;bottom:0;align-items:center}
  /* すりガラス。白ベタに見えないよう、透かして・ふちに光を溜めて・ごく薄い水色を差す */
  .cta button{font-size:13px;letter-spacing:.18em;text-indent:.18em;padding:19px 30px;border-radius:999px;
    background:linear-gradient(160deg,rgba(255,255,255,.60) 0%,rgba(238,247,255,.34) 46%,rgba(226,240,255,.44) 100%);
    -webkit-backdrop-filter:blur(22px) saturate(1.9);backdrop-filter:blur(22px) saturate(1.9);
    border:.5px solid rgba(255,255,255,.9);
    box-shadow:0 1px 1px rgba(255,255,255,.95) inset,
               0 -1px 1px rgba(150,180,225,.28) inset,
               0 1px 2px rgba(20,50,100,.06),
               0 14px 34px -18px rgba(13,40,90,.34);
    transition:transform .5s cubic-bezier(.16,1,.3,1), background .4s}
  .cta button::after{display:none}
  /* 上ふちの光。ガラスの厚みに見せる */
  .cta button::before{content:'';position:absolute;left:9%;right:9%;top:.5px;height:42%;border-radius:999px 999px 60% 60%;
    background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,0));pointer-events:none}
  .cta button:active{transform:scale(.97);
    background:linear-gradient(160deg,rgba(255,255,255,.74) 0%,rgba(232,244,255,.52) 100%)}
}
.backlink{position:fixed;left:26px;bottom:44px;z-index:7;font:inherit;font-size:11px;letter-spacing:.22em;
  color:var(--sub);background:none;border:none;cursor:pointer;padding:8px 4px}
.backlink:hover{color:var(--ink)}



.meter .track i{position:absolute;top:-2px;width:5px;height:5px;background:var(--accent);border-radius:50%;transition:left .4s cubic-bezier(.2,.8,.2,1)}



.btn.primary{padding:15px 40px;font-size:13px;letter-spacing:.2em}
.btn{font:inherit;font-size:11px;letter-spacing:.14em;font-weight:800;padding:10px 18px;
  border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;transition:.18s}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{opacity:.82}

/* ---------- 右パネル（詳細） ---------- */
.panel{position:fixed;z-index:7;top:0;right:0;width:330px;height:100%;
  border-left:1px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(18px);
  padding:34px 28px;transform:translateX(102%);transition:transform .55s cubic-bezier(.16,1,.3,1);
  overflow-y:auto}
.panel.on{transform:none}
.panel .idx{font-size:10px;letter-spacing:.28em;color:var(--sub)}
.panel h2{font-size:23px;font-weight:800;margin:8px 0 2px;line-height:1.25}
.panel .meta{font-size:11px;color:var(--sub);letter-spacing:.06em;margin-bottom:22px}
/* 味の9軸。数字が主役なので等幅で桁を揃え、目盛りを薄く敷いて量として読ませる */
.row{margin-bottom:13px}
.row .l{display:flex;justify-content:space-between;align-items:baseline;
  font-size:10px;letter-spacing:.12em;margin-bottom:5px;color:var(--sub)}
.row .l b{color:var(--ink);font:700 11.5px/1 "SF Mono",ui-monospace,monospace;
  font-variant-numeric:tabular-nums}
.row .t{height:3px;background:var(--line);position:relative;border-radius:2px;overflow:hidden;
  background-image:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(13,30,60,.16) calc(10% - 1px) 10%)}
.row .t i{position:absolute;left:0;top:0;height:100%;border-radius:2px;
  background:linear-gradient(90deg,rgba(0,194,232,.4),var(--accent));
  transition:width .7s cubic-bezier(.16,1,.3,1)}
.panel .close{position:absolute;top:26px;right:24px;font-size:19px;color:var(--sub);cursor:pointer;line-height:1}

/* ---------- 全画面オーバーレイ（コンセプト） ---------- */
.ov{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:8;display:none;
  background:transparent;cursor:pointer;pointer-events:auto}
.ov.on{display:flex}
.ov .in{max-width:820px}
.ov .k{font-size:10px;letter-spacing:.32em;color:var(--sub);margin-bottom:0}
#hSpace{flex:none;width:1px}
.ov h1{font-size:clamp(26px,4.4vw,52px);line-height:1.34;font-weight:800;letter-spacing:.01em}
.ov .in{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(860px,84vw);text-align:center;display:flex;flex-direction:column;align-items:center}
.ov .k,.ov .next{opacity:0;transform:translateY(14px);transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1)}
.ov p{display:block}
.ov p .ln{display:block;overflow:hidden;white-space:nowrap}
.ov p .ln i{display:block;font-style:normal;transform:translateY(115%);opacity:0;
  transition:transform 1.05s cubic-bezier(.16,1,.3,1),opacity .8s ease}
.ov.rev p .ln i{transform:none;opacity:1}
.ov.rev .k{opacity:1;transform:none;transition-delay:.15s}
.ov.rev .next{opacity:.9;transform:none;transition-delay:1.1s}
.ov p{margin:0;font-size:clamp(13px,1.5vw,16px);line-height:1.95;color:#3c434f;width:100%}
/* 背後を流れるお菓子に文字が乗ると読めない。文字の周りだけ白を薄く敷く。
   ただし見出しはこの下（canvas）に描くので、白を敷くのは本文のまわりだけにする。
   .in 全体に敷くと、見出しが白幕ごしになって灰色に見える */
.ov .in{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  padding:26px 30px;border-radius:4px;background:none}
.ov p{position:relative}
.ov p::before{content:'';position:absolute;left:-40px;right:-40px;top:-34px;bottom:-30px;z-index:-1;
  background:radial-gradient(ellipse 72% 64% at 50% 50%,
    rgba(255,255,255,.94) 0%, rgba(255,255,255,.86) 54%, rgba(255,255,255,0) 100%)}
.ov .next{margin-top:46px;font-size:10.5px;letter-spacing:.24em;color:var(--sub)}
.yrs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 20px;margin-top:30px;font-size:11px;color:#3c434f}
.yrs span{white-space:nowrap}
.yrs b{font-weight:800}

/* ---------- 生成画面：1問1画面（計測器の佇まい） ---------- */
.genui{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:6;display:none;pointer-events:none;--cy:#00c2e8}
.genui.on{display:block}
body.genmode .hud.tl,body.genmode .hud.bl,body.genmode .backlink{display:none}   /* 生成画面では元のHUDを隠す */
.qhead{position:absolute;top:38px;left:44px}
.qbrand{font-size:14px;font-weight:800;letter-spacing:.26em;color:var(--ink)}
.qnum{font-size:12px;letter-spacing:.2em;color:var(--sub);margin-top:8px}
.qnum b{color:var(--cy);font-weight:700}
.qtrack{position:relative;width:330px;height:1px;background:#c9ced6;margin-top:26px}
.qtrack i{position:absolute;left:0;top:0;height:1px;background:var(--cy);width:8%;
  transition:width .75s cubic-bezier(.16,1,.3,1)}
.qticks{position:absolute;top:-6px;bottom:-6px;left:0;right:0;display:flex;justify-content:space-between}
.qticks span{position:relative;width:1px;height:13px;background:#c9ced6}
.qticks span::after{content:attr(data-n);position:absolute;top:17px;left:50%;transform:translateX(-50%);
  font:400 10px/1 "SF Mono",ui-monospace,monospace;color:#aab1bd;letter-spacing:.06em}
.qticks span.on{background:var(--cy)}
.qticks span.on::after{color:var(--cy)}
.qticks span.on::before{content:'';position:absolute;left:50%;top:6px;width:7px;height:7px;margin-left:-3.5px;
  border-radius:50%;background:var(--cy)}

.qwrap{position:absolute;left:0;right:0;top:30vh;text-align:center;pointer-events:auto}
.qtitle{font-size:clamp(26px,3.1vw,38px);font-weight:700;letter-spacing:.04em;margin-bottom:96px;
  line-height:1.4;white-space:nowrap;max-width:96vw;margin-left:auto;margin-right:auto}
.qtitle em{font-style:normal;font-weight:400;font-size:.58em;color:var(--sub);
  letter-spacing:.1em;margin:0 .55em 0 .34em;vertical-align:.06em}
.qtitle em:last-child{margin-right:0}
.qval{font-size:11px;letter-spacing:.24em;color:var(--sub);margin-bottom:14px}
/* 9個の丸。全部同じ白丸だと世論調査の用紙になる。
   左端の味から右端の味へ、丸そのものを色で渡していく。
   ＝答えている最中も「味を選んでいる」ことが目に見える */
.qcircles{display:flex;justify-content:center;align-items:center;gap:clamp(14px,2.6vw,42px);position:relative}
.qcircles button{width:clamp(38px,3.4vw,54px);height:clamp(38px,3.4vw,54px);border-radius:50%;
  border:1.5px solid var(--qc,#0d1117);background:var(--qbg,transparent);
  cursor:pointer;position:relative;padding:0;
  transition:transform .45s cubic-bezier(.34,1.56,.64,1),border-color .3s,background .3s,box-shadow .3s}
.qcircles button:hover{transform:scale(1.14);box-shadow:0 0 0 6px var(--qh,rgba(0,194,232,.14))}
.qcircles button.on{transform:scale(1.2);background:var(--qc,#0d1117);border-color:var(--qc,#0d1117);
  box-shadow:0 6px 20px -6px var(--qc,#0d1117)}
.qcircles button.on::after{content:'';position:absolute;left:50%;top:50%;width:13px;height:13px;
  margin:-6.5px 0 0 -6.5px;border-radius:50%;background:#fff;
  animation:qpop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes qpop{0%{transform:scale(0)}100%{transform:scale(1)}}
/* 押した瞬間の輪。触って何も起きないと、次を押す気にならない */
.qcircles button.hit::before{content:'';position:absolute;inset:-4px;border-radius:50%;
  border:2px solid var(--qc,#0d1117);animation:qring .55s cubic-bezier(.16,1,.3,1) forwards;pointer-events:none}
@keyframes qring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(2.1);opacity:0}}

.qaxis{position:relative;margin-top:30px;display:flex;justify-content:space-between;align-items:flex-start;
  width:min(780px,74vw);margin-left:auto;margin-right:auto;
  font-size:21px;font-weight:700;letter-spacing:.1em;color:var(--ink)}
.qaxis span,.qaxis b{font-weight:700;display:flex;flex-direction:column;align-items:center;gap:9px}
/* 両端の味に絵をつける。文字だけだと読む作業になる */
.qaxis .ic{display:block;width:clamp(46px,4.2vw,64px);height:clamp(46px,4.2vw,64px)}
.qaxis .ic svg{width:100%;height:100%;overflow:visible}
.qrule{position:absolute;left:0;right:0;top:-16px;height:9px;
  background:repeating-linear-gradient(90deg,#c9ced6 0 1px,transparent 1px 32px);
  border-top:1px solid #dfe3e9}
.qwrap.out{opacity:0;transform:translateX(-36px);transition:opacity .34s ease,transform .34s cubic-bezier(.4,0,1,1)}
.qwrap.in{opacity:0;transform:translateX(36px)}
.qwrap.show{opacity:1;transform:none;transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1)}

.qfree input{font:inherit;font-size:12px;letter-spacing:.1em;text-align:center;width:min(320px,70vw);
  border:none;border-bottom:1px solid #c9ced6;background:none;padding:10px 4px;color:var(--ink);outline:none;transition:border-color .4s}
.qfree input:focus{border-color:var(--cy)}
/* 起動ボタン。塗った玉ではなく、他の画面と同じ「細い線と余白」で作る */
.orb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
  width:296px;height:296px;border-radius:50%;
  /* 真っ白な画面に白い丸だと押せる場所に見えない。
     ベタ塗りにはせず、作品の基調色をごく薄く敷いて「ここだけ温度が違う」ことを示す */
  border:1px solid rgba(0,162,199,.36);background:rgba(0,194,232,.065);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  cursor:pointer;pointer-events:auto;font:inherit;color:var(--ink);opacity:0;padding:0;
  transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1)}
.orb::before{content:'';position:absolute;left:15px;top:15px;right:15px;bottom:15px;
  border-radius:50%;border:1px dashed rgba(0,162,199,.22)}
.orb.on{display:flex}
.orb.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.orb.go{opacity:0;transform:translate(-50%,-50%) scale(1.5)}
/* 白い画面に白い丸なので、放っておくと「ここが押せる」と気づかれない。
   息をするようにゆっくり明滅させて、押す場所を一箇所に絞る */
.orb.show::after{content:'';position:absolute;inset:-2px;border-radius:50%;
  border:1px solid rgba(0,194,232,.55);animation:orbPulse 2.6s ease-out infinite;pointer-events:none}
@keyframes orbPulse{
  0%{transform:scale(.94);opacity:0}
  22%{opacity:.85}
  100%{transform:scale(1.16);opacity:0}
}
@media (prefers-reduced-motion:reduce){ .orb.show::after{animation:none;opacity:.5} }
.orb span{font-size:15px;font-weight:700;letter-spacing:.16em;text-indent:.16em;line-height:1.95;
  text-align:center;pointer-events:none;white-space:nowrap}
.orb small{font:400 9.5px/1 "SF Mono",ui-monospace,monospace;letter-spacing:.3em;
  color:var(--cy);text-indent:.3em;pointer-events:none}
.orb:hover{transform:translate(-50%,-50%) scale(1.03)}
.orb:hover::before{border-color:rgba(0,194,232,.34)}
.qback{position:fixed;left:44px;bottom:44px;z-index:7;font:inherit;font-size:11px;letter-spacing:.22em;
  color:var(--sub);background:none;border:none;cursor:pointer;padding:8px 4px;pointer-events:auto}
.qback:hover{color:var(--ink)}
.gres{position:absolute;left:0;right:0;bottom:132px;text-align:center;pointer-events:none;opacity:0;
  transform:translateY(14px);transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1)}
.genui.ready .gres{opacity:1;transform:none;pointer-events:auto}
.gres .gname{font-size:26px;letter-spacing:.18em;font-weight:800;margin-bottom:10px}
/* 発明の一句＝キャッチコピー。名前の直下、紹介文より一段大きく太く */
.gres .gnew{max-width:min(1040px,88vw);margin:0 auto 14px}
.gres .gnew[hidden]{display:none}
.gres .gnew b{font-size:16.5px;font-weight:700;letter-spacing:.1em;line-height:1.8;color:var(--ink)}
.gres .gcopy{font-size:13px;letter-spacing:.06em;line-height:1.95;color:#3c434f;
  max-width:min(1040px,88vw);margin:0 auto 22px}
/* 作られたお菓子の9軸。結果は横長の画面で見るので3列に畳む */
.gbars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px 26px;
  max-width:min(1040px,88vw);margin:0 auto 22px;text-align:left}
.gbars .b{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:baseline}
.gbars .b i{grid-column:1/-1;display:block;height:3px;background:var(--line);position:relative;
  border-radius:2px;overflow:hidden}
.gbars .b i::after{content:'';position:absolute;left:0;top:0;height:100%;width:var(--w,0%);
  background:linear-gradient(90deg,rgba(0,194,232,.45),var(--cy));
  border-radius:2px;transition:width 1.1s cubic-bezier(.16,1,.3,1)}
.gbars .b span{font-size:9.5px;letter-spacing:.14em;color:var(--sub)}
.gbars .b b{font:700 10.5px/1 "SF Mono",ui-monospace,monospace;color:var(--ink);
  font-variant-numeric:tabular-nums}
@media(max-width:820px){
  .gbars{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 16px;max-width:88vw}
  .gbars .b span{font-size:9px;letter-spacing:.08em}
}
.gqr{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:20px}
.qrbox{width:74px;height:74px;background:#0d1117}
.gqr span{font-size:9.5px;letter-spacing:.24em;color:var(--sub)}
.qagain{font:inherit;font-size:11px;letter-spacing:.24em;color:var(--cy);background:none;border:none;cursor:pointer;padding:8px}
.gmeta{position:absolute;left:44px;bottom:86px;font-size:10px;letter-spacing:.16em;color:#aab1bd;pointer-events:none}
@media(max-width:820px){
  .qhead{left:20px;top:24px}.qback{left:20px;bottom:28px}
  .qbrand{display:none}   /* 右上のHUDと重なる。作品名はそちらに出ている */
  /* 端で切れるより、少し縮めて全部見せる */
  /* 6.4vwだと最長の「ひと口で終わるか手が止まらないか」が390px幅で右端から溢れる */
  .qtitle{font-size:min(5.5vw,25px);margin-bottom:56px;letter-spacing:0;white-space:nowrap}
  .qtitle em{font-size:.58em;margin:0 .30em 0 .18em}

  .qcircles button.on::after{width:9px;height:9px;margin:-4.5px 0 0 -4.5px}

  /* 縦画面は下が余る。設問一式を少し下げて、上下の重心を合わせる */
  .qwrap{top:33vh}
  .qtrack{width:min(330px,84vw)}
  .orb{width:250px;height:250px}
  .orb span{font-size:13px;letter-spacing:.12em;text-indent:.12em}
  .ov .in{width:min(860px,88vw)}

  /* 縦画面は下に余白が余る。結果一式を下へ寄せ、絵の場所を広く取る */
  .gres{bottom:56px}
}

<script src="reveal_src.js"></script>
<script src="picker.js"></script>

<script src="particles.js"></script>
<script src="data.js"></script>
<script>
/* ============================================================
   おかしの設計図 — 描画エンジン
   ・54点のパッケージ画像を白い電脳空間に浮遊させる
   ・各画像から抽出した190個の粒子シードを実際に animate する
   ・粒子＝画像そのものの構造（PARTICLE_DATA は画像から実測）
   ============================================================ */
const C = document.getElementById('c'), X = C.getContext('2d');
let W=0,H=0,DPR=1, T=0, lastTs=0, fps=60;
let MODE='FLOAT';                 // FLOAT / DETAIL / CONCEPT / GEN
let snacks=[], images=[], loaded=0;
let selected=null, dust=[];

const NOISE = ['#00c2ff','#ff2ea6','#ffd400','#7c4dff','#00e07a'];
/* 侵食用の使い回しバッファ（画像に穴を開けてから合成するため） */
const TRIG_N=2048, SINT=new Float32Array(TRIG_N), COST=new Float32Array(TRIG_N);
for(let i=0;i<TRIG_N;i++){ const a=i/TRIG_N*6.283185307; SINT[i]=Math.sin(a); COST[i]=Math.cos(a); }
const fsin=x=>SINT[((x*325.949+0.5)|0)&(TRIG_N-1)];   // x はラジアン
const fcos=x=>COST[((x*325.949+0.5)|0)&(TRIG_N-1)];
const SC=document.createElement('canvas'); SC.width=SC.height=256;
const SX=SC.getContext('2d',{willReadFrequently:false});
const rnd=(a,b)=>a+Math.random()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ---------- リサイズ ---------- */
let lastW=0,lastH=0;
function resize(){
  W=innerWidth; H=innerHeight; DPR=Math.min(devicePixelRatio||1,1.5);
  C.width=W*DPR; C.height=H*DPR; X.setTransform(DPR,0,0,DPR,0,0);
  layout();
  if(MODE==='CONCEPT' && (W!==lastW||H!==lastH)){        // 幅が実際に変わった時だけ組み直す
    snacks.forEach(s2=>{ s2.tw=Math.min(W*0.105,H*0.17); });
    if(kinText){ try{
      const t=kinT; kinSample(kinText); kinT=t; kinReflow(false);
      if(t>1.15) kin.forEach(p=>{ if(p.live){ p.x=p.tx; p.y=p.ty; } });   // 出来上がった文字は崩さない
    }catch(e){} }
  }
  lastW=W; lastH=H;
}

/* ============================================================
   Snack
   ============================================================ */
class Snack{
  constructor(i){
    const d = OKASHI[i] || {name:'—',f:'bag',y:0,v:[50,50,0,0,50,50,50,50,50]};
    const pd = (typeof PARTICLE_DATA!=='undefined' && PARTICLE_DATA[i]) || null;
    this.i=i; this.data=d; this.ar = pd? pd.ar : 0.8;
    this.img=null;
    this.x=0; this.y=0; this.w=140; this.baseW=140;
    this.tx=0; this.ty=0; this.tw=140;      // 目標値
    this.phase=Math.random()*Math.PI*2;
    this.spin=rnd(.55,.95);
    this.alpha=1; this.talpha=1;
    this.disp=1;  this.tdisp=1;             // 粒子の拡散度
    this.erode=1; this.terode=1;            // 画像本体の侵食の強さ
    this.esc=0;                             // 離脱（コンセプト時に散る）
    this.evx=0; this.evy=0;

    // 粒子
    const p = pd? pd.p : [];
    const n = p.length;
    this.n=n;
    this.px=new Float32Array(n); this.py=new Float32Array(n);
    this.pe=new Uint8Array(n); this.ph=new Float32Array(n); this.ps=new Float32Array(n);
    this.pc=new Array(n);           // 色は文字列で先に作る（毎フレームの文字列連結が最大のコスト）
    for(let k=0;k<n;k++){
      this.px[k]=p[k][0]/1000-0.5; this.py[k]=p[k][1]/1000-0.5;
      this.pc[k]='rgb('+p[k][2]+','+p[k][3]+','+p[k][4]+')';
      this.pe[k]=p[k][5];
      this.ph[k]=Math.random(); this.ps[k]=rnd(.55,2.1);
    }
  }
  get h(){ return this.w/this.ar; }

  update(dt){
    this.x=lerp(this.x,this.tx,1-Math.pow(.0016,dt));
    this.y=lerp(this.y,this.ty,1-Math.pow(.0016,dt));
    this.w=lerp(this.w,this.tw,1-Math.pow(.0016,dt));
    this.alpha=lerp(this.alpha,this.talpha,1-Math.pow(.004,dt));
    this.disp=lerp(this.disp,this.tdisp,1-Math.pow(.02,dt));
    this.erode=lerp(this.erode,this.terode,1-Math.pow(.02,dt));
    if(this.esc){ this.tx+=this.evx*dt; this.ty+=this.evy*dt; this.x+=this.evx*dt; this.y+=this.evy*dt; }
  }

  draw(){
    if(this.alpha<0.012) return;
    const w=this.w, h=this.h;
    if(this.x+w<-60||this.x-w>W+60) return;

    // ふわふわ浮遊 ＋ 左右に±10度
    const bob = Math.sin(T*0.9*this.spin + this.phase)*w*0.035;
    const rot = Math.sin(T*0.62*this.spin + this.phase*1.7) * 10 * Math.PI/180;

    X.save();
    X.translate(this.x, this.y+bob);
    X.rotate(rot);
    X.globalAlpha=this.alpha;

    // 本体。写真をそのまま貼らず、毎フレーム「侵食」してから合成する。
    // 穴は画像から実測した縁の粒子座標に開くので、崩れがシルエットに沿う。
    if(this.img){
      if(w<=260){
        // 小さく表示されている間は侵食を省く（1〜2pxの穴は見えないのに、45個ぶんのオフスクリーン処理が最も重い）
        X.globalCompositeOperation='multiply';
        X.filter='brightness(1.07) contrast(1.05)';
        X.drawImage(this.img,-w/2,-h/2,w,h);
        X.filter='none';
        X.globalCompositeOperation='source-over';
      } else {
        const pad=Math.ceil(w*0.10), sw=Math.ceil(w)+pad*2, sh=Math.ceil(h)+pad*2;
        if(SC.width<sw||SC.height<sh){ SC.width=Math.max(SC.width,sw); SC.height=Math.max(SC.height,sh); }
        SX.clearRect(0,0,sw,sh);
        SX.filter='brightness(1.07) contrast(1.05)';
        SX.drawImage(this.img,pad,pad,w,h);
        SX.filter='none';
        SX.globalCompositeOperation='destination-out';
        const er=this.erode, step=3;
        for(let k=0;k<this.n;k+=step){
          const ph=this.ph[k], edge=this.pe[k];
          const o=fsin(T*1.9+ph*23.3)*0.5+0.5;
          const th=edge?0.10:0.55;
          if(o<th) continue;
          const g=(o-th)/(1-th);
          const r=(edge?0.22:0.16)*(1+g*1.5)*er;
          if(r<0.35) continue;
          const gx=pad+w/2+this.px[k]*w+fcos(ph*6.283+T*0.6)*w*0.012*er;
          const gy=pad+h/2+this.py[k]*h+fsin(ph*6.283+T*0.6)*w*0.012*er;
          SX.globalAlpha=Math.min(0.35+g*0.75,1);
          SX.fillRect(gx-r,gy-r,r*2,r*2);
        }
        SX.globalAlpha=1; SX.globalCompositeOperation='source-over';
        X.globalCompositeOperation='multiply';
        X.drawImage(SC,0,0,sw,sh,-w/2-pad,-h/2-pad,sw,sh);
        X.globalCompositeOperation='source-over';
      }
    }

    // 粒子（パラパラと明滅しながら、縁ほど外へ飛ぶ）
    const d=this.disp, sc=w, sch=sc/this.ar;
    const pstep = w>300 ? 1 : (w>200 ? 2 : 3);   // 表示サイズに応じて間引く
    const tf=T*7.5, tt=(T*4)|0, ta=T*0.7, tr=T*1.4;
    for(let k=0;k<this.n;k+=pstep){
      const ph=this.ph[k];
      const f=(tf+ph*11)%1;
      let a = f<0.42?1 : f<0.62?0.42 : f<0.78?0.12 : 0;
      if(a<=0) continue;
      const edge=this.pe[k];
      const spread = d*(edge?1.9:0.55);
      const ang = ph*6.283+ta;
      const rr  = (fsin(tr+ph*9)*0.5+0.5)*spread + (fsin(T*3.1+ph*41)*0.5+0.5)*0.55;
      const gx = this.px[k]*sc + fcos(ang)*rr*sc*0.055 + fsin(T*2.3+ph*17)*sc*0.006;
      const gy = this.py[k]*sch + fsin(ang)*rr*sc*0.055 + fcos(T*2.7+ph*29)*sc*0.006;
      const s = this.ps[k]*(1+d*0.25);
      X.globalAlpha = a*this.alpha*(edge?0.95:0.6);
      X.fillStyle = ((k*7+tt)%53)===0 ? NOISE[k%5] : this.pc[k];
      X.fillRect(gx-s/2, gy-s/2, s, s);
    }
    X.restore();
    X.globalAlpha=1;
  }

  hit(mx,my){
    const w=this.w,h=this.h;
    return mx>this.x-w*0.55 && mx<this.x+w*0.55 && my>this.y-h*0.55 && my<this.y+h*0.55;
  }
}

/* ============================================================
   レイアウト
   ============================================================ */
const ROWS=4;
let rowSpan=[], rowDir=[], rowY=[], rowSpeed=[], rowCount=[], colCount=1;
function layout(){
  const base = W<820 ? Math.min(H*0.115, W*0.215) : Math.min(H*0.155, W*0.115);
  rowCount=new Array(ROWS).fill(0);
  snacks.forEach((s,i)=>{ s.row=i%ROWS; s.slot=rowCount[s.row]++; });
  // 狭い画面は上2列・下2列に分け、中央にボタンの居場所を空ける。
  // ボタンも1列と数える。ただし中心を等間隔に並べるとボタンは絵より背が低いぶん
  // 上下だけ余白が空いて見えるので、「絵とボタンの隙間」が列どうしの隙間と
  // 同じ幅になる距離を計算して置く
  let mRow=[0,0,0,0];
  if(W<820){
    const cy=H*0.5;
    const bh=($('btnGen')&&$('btnGen').offsetHeight)||56;   // ボタンの実寸
    const sh=base*1.24;                                     // 絵の見た目の高さ
    const gap=H*0.148;                                      // 列どうしの間隔
    const d=Math.max(gap*0.60, gap-sh*0.5+bh*0.5);          // ボタン⇔隣の列
    mRow=[cy-d-gap, cy-d, cy+d, cy+d+gap];
  }
  for(let r=0;r<ROWS;r++){
    rowY[r] = W<820 ? mRow[r] : H*(0.155+r*0.205);
    rowDir[r]=r%2?1:-1;
    rowSpeed[r]=(9+r*2.4);
    // 行ごとの実数で間隔を決める（全行共通の割り算にすると端に1マス分の穴が空く）
    rowSpan[r]=Math.max(rowCount[r],1)*base*(W<820?2.35:1.85);   // 狭い画面は間隔を広げて重なりを防ぐ
  }
  snacks.forEach(s=>{
    s.baseW=base*rnd(0.86,1.14);
    if(MODE==='FLOAT'){ s.tw=s.baseW; s.talpha=1; s.tdisp=1; }
  });
}

/* ============================================================
   浮遊ダスト（画面全体の電子ノイズ）
   ============================================================ */
function initDust(){
  dust=[];
  for(let i=0;i<570;i++){
    dust.push({x:Math.random()*W,y:Math.random()*H,
      vx:rnd(-6,6),vy:rnd(-4,4),s:rnd(.6,1.8),ph:Math.random(),
      c: Math.random()<0.28 ? NOISE[(Math.random()*NOISE.length)|0] : 'rgba(20,40,80,.55)'});
  }
}
function drawDust(dt){
  for(const d of dust){
    d.x+=d.vx*dt; d.y+=d.vy*dt;
    if(d.x<0)d.x+=W; if(d.x>W)d.x-=W; if(d.y<0)d.y+=H; if(d.y>H)d.y-=H;
    const f=(T*5+d.ph*9)%1;
    const a=f<0.5?0.5:f<0.7?0.2:0;
    if(a<=0)continue;
    X.globalAlpha=a; X.fillStyle=d.c;
    X.fillRect(d.x,d.y,d.s,d.s);
  }
  X.globalAlpha=1;
}

/* ============================================================
   背景（グリッド＋レティクル）
   ============================================================ */
function drawBG(){
  X.fillStyle='#ffffff'; X.fillRect(0,0,W,H);   // AI生成画像の背景と完全に一致させる
  X.strokeStyle='rgba(13,40,90,.035)'; X.lineWidth=1;
  const gs=62;
  X.beginPath();
  for(let x=gs;x<W;x+=gs){X.moveTo(x+.5,0);X.lineTo(x+.5,H);}
  for(let y=gs;y<H;y+=gs){X.moveTo(0,y+.5);X.lineTo(W,y+.5);}
  X.stroke();
  // レティクル
  X.strokeStyle='rgba(13,30,60,.22)'; X.lineWidth=1;
  const m=26,L=13;
  const pts=[[m,m],[W-m,m],[m,H-114],[W-m,H-114],[W/2,m],[W/2,H-114]];
  X.beginPath();
  for(const[px,py]of pts){X.moveTo(px-L,py);X.lineTo(px+L,py);X.moveTo(px,py-L);X.lineTo(px,py+L);}
  X.stroke();
}

/* ============================================================
   メインループ
   ============================================================ */
function tick(dt){
  drawBG();
  drawDust(dt);
  if(MODE==='FLOAT'||MODE==='DETAIL'||MODE==='CONCEPT'){
    for(const s of snacks){
      if(MODE==='CONCEPT'){
        const span=colCount*Math.min(W*0.105,H*0.17)*4.2;   // 間隔を広げる
        const dir=s.col? 1 : -1;                       // 左列は上へ、右列は下へ
        let sy=(s.cslot*span/Math.max(colCount,1) + T*26*dir);
        sy=((sy%span)+span)%span;
        s.tx=s.col? W*0.90 : W*0.10;
        s.ty=-span*0.1+sy*(H+span*0.2)/span;
        if(Math.abs(s.ty-s.y)>H*0.5){ s.y=s.ty; s.x=s.tx; }
      }
      if(MODE==='FLOAT'){
        const span=rowSpan[s.row];
        let sx=(s.slot*span/Math.max(rowCount[s.row],1) + T*rowSpeed[s.row]*rowDir[s.row]);
        sx=((sx%span)+span)%span;
        s.tx=-span*0.12+sx*(W+span*0.24)/span;
        s.ty=rowY[s.row];
        if(!s.snapped){ s.x=s.tx; s.y=s.ty; s.snapped=true; }
        if(Math.abs(s.tx-s.x)>W*0.5){ s.x=s.tx; }
      }
      s.update(dt);
    }
    for(const s of snacks) if(s!==selected) s.draw();
    if(selected) selected.draw();
  }
  if(MODE==='CONCEPT') kinDraw(dt);
  if(MODE==='GEN'){
    // 結果の文字（名前・説明・もう一度つくる）は RESULT の時だけ出す。
    // どの経路で ready が付いても、ここで必ず取り消される
    if(gStep!=='RESULT' && $('genui').classList.contains('ready')) $('genui').classList.remove('ready');
    if(rvOn){
      const done=revealDraw(dt);
      // 白が満ちきってから下に置く。立ち上がりの間に出すと、白より先に見えてしまう
      if(rvFlash>=RVP.wIn && aiImg) drawGenerated(dt);
      if(done){ $('genui').classList.add('ready'); gResult(); }
    }
    else if(gStep==='RESULT'){ gShow=1; if(aiImg) drawGenerated(dt); drawFlash(dt); }
    else { orbDust(); qBurst(); }
    drawOrbFx(dt);
    drawQFx(dt);
  }
  updateHUD();
}
let seeking=false;
function frame(ts){
  if(seeking){ tick(0); requestAnimationFrame(frame); return; }   // 停止中も再描画し続ける
  if(!lastTs)lastTs=ts;
  let dt=Math.min((ts-lastTs)/1000,.05); lastTs=ts; T+=dt;
  fps=lerp(fps,1/Math.max(dt,.001),.05);
  tick(dt);
  requestAnimationFrame(frame);
}
/* 検証用：?seek=2.5 でその時刻まで固定ステップで進めて停止する */
function seekTo(sec){
  seeking=true; requestAnimationFrame(frame); const dt=1/20;   // 粒子が増えたので粗いステップで進める（検証専用）
  for(let t=0;t<sec;t+=dt){ T+=dt; tick(dt); }
}

 {k:'CONCEPT 01 / 03',

/* ============================================================
   コンセプト見出し ── 散った粒子が集まって文字になる
   文字を一度canvasに描いて点群化し、既存の粒子をそこへ吸い寄せる。
   装飾ではなく、作品と同じ粒子エンジンで文字を作っている。
   ============================================================ */
const KC=document.createElement('canvas'), KX=KC.getContext('2d',{willReadFrequently:true});
let kin=[], kinOn=false, kinT=0, kinText='', kinFs=0, kinOx=0, kinOy=0, kinLh=0;
function kinRebase(reset){
  kin.forEach(p=>{ if(!p.live) return;
    p.tx = kinOx + p.lx; p.ty = kinOy + p.ly;
    if(reset){ const a=p.ang, r=Math.max(W,H)*p.rad;
      p.x=p.tx+Math.cos(a)*r; p.y=p.ty+Math.sin(a)*r*0.6; }
  });
  if(reset) kinT=0;               // リサイズでは進行度を巻き戻さない
}
// 見出しの位置だけ測り直す（文字の組み直しはしない）
function kinReflow(reset){
  if(!KC.height) return;
  $('hSpace').style.height=(KC.height+74)+'px';
  kinOy=$('hSpace').getBoundingClientRect().top+30;
  kinOx=Math.round((W||innerWidth||1280)*0.5-KC.width*0.5);
  kinRebase(reset);
}
function kinSample(text){
  if(!text) return;
  const VW=W||innerWidth||1280;
  const lines=text.split('\n');
  const KFONT=w=>w+'px "Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif';
  let fs=Math.max(20, Math.min(VW*0.058, 58));
  // 画面幅からはみ出したら、はみ出したぶんだけ字を小さくする。
  // 中央寄せなので、はみ出しは必ず左右両方で切れる
  const measure=s=>{ KX.font='800 '+KFONT(s); return Math.max(...lines.map(l=>KX.measureText(l).width)); };
  const limit=VW-Math.max(28,VW*0.075)*2;
  let wmax=measure(fs);
  if(wmax>limit){ fs=Math.max(15,fs*limit/wmax); wmax=measure(fs); }
  const lh=fs*1.34;
  KC.width=Math.ceil(wmax)+8; KC.height=Math.ceil(lh*lines.length+fs*0.5);
  KX.clearRect(0,0,KC.width,KC.height);
  KX.fillStyle='#000'; KX.strokeStyle='#000';
  KX.font='800 '+KFONT(fs);
  KX.textBaseline='top';
  // 800 のウエイトを持たない書体だと線が細く、白地では灰色に見える。
  // 同色で縁取りして、太さを実体として与える
  KX.lineJoin='round'; KX.lineWidth=Math.max(1,fs*0.046);
  lines.forEach((l,i)=>{ KX.strokeText(l,0,i*lh); KX.fillText(l,0,i*lh); });
  const d=KX.getImageData(0,0,KC.width,KC.height).data, pts=[];
  const step=Math.max(2,Math.round(fs/22));          // 密度を上げる
  for(let y=0;y<KC.height;y+=step)for(let x=0;x<KC.width;x+=step){
    if(d[(y*KC.width+x)*4+3]>105) pts.push([x,y]);
  }
  const ox=Math.max(VW*0.05, VW*0.5-KC.width*0.5);
  const VH=H||innerHeight||720;
  const oy=Math.max(VH*0.10, VH*0.46-lh*lines.length-72);
  kinText=text; kinFs=fs; kinOx=ox; kinOy=oy; kinLh=lh;
  while(kin.length<pts.length) kin.push({x:0,y:0,tx:0,ty:0,ph:Math.random(),c:'#0d1117',s:1,live:false});
  kin.forEach(p=>p.live=false);
  pts.forEach((q,i)=>{
    const p=kin[i];
    p.lx=q[0]; p.ly=q[1]; p.tx=ox+q[0]; p.ty=oy+q[1]; p.live=true;
    p.ang=Math.random()*6.283; p.rad=0.42+Math.random()*0.35;
    p.delay=(q[0]/Math.max(KC.width,1))*0.42;        // 左から順に立ち上がる
    const a=p.ang, r=Math.max(W,H)*p.rad;
    p.x=p.tx+Math.cos(a)*r; p.y=p.ty+Math.sin(a)*r*0.6;
    p.ph=Math.random(); p.s=rnd(1.0,2.3);
    p.c = '#0d1117';   // 文字は必ず黒。読みやすさを最優先する
  });
  kinOn=true; kinT=0;
}
function kinDraw(dt){
  if(!kinOn) return;
  kinT+=dt;
  // 収束しきったら、粒子ではなく黒のベタ文字に置き換える（点々だと読みにくい）
  const solid = Math.max(0, Math.min(1, (kinT-1.15)/0.55));
  if(solid>0){
    X.save();
    X.globalAlpha=solid;
    X.fillStyle='#0b1016'; X.strokeStyle='#0b1016';
    X.font='800 '+kinFs+'px "Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif';
    X.textBaseline='top'; X.lineJoin='round'; X.lineWidth=Math.max(1,kinFs*0.046);
    kinText.split('\n').forEach((l,i)=>{ X.strokeText(l,kinOx,kinOy+i*kinLh); X.fillText(l,kinOx,kinOy+i*kinLh); });
    X.restore();
    if(solid>=1) return;                 // 完全に文字になったら粒子は描かない
  }
  const k=1-Math.pow(0.0009,dt);           // 吸い寄せの強さ
  for(const p of kin){
    if(!p.live){ p.x+=(p.x-W/2)*dt*0.9; p.y+=(p.y-H/2)*dt*0.9; continue; }
    if(kinT<p.delay) continue;                       // 左から順に動き出す
    p.x+=(p.tx-p.x)*k; p.y+=(p.ty-p.y)*k;
    const d2=Math.abs(p.tx-p.x)+Math.abs(p.ty-p.y);
    // 飛んでいる間だけ明滅させ、到着したら完全に静止させる（チリチリすると文字が読めない）
    const a = (d2>3 ? (0.35+((kinT*6+p.ph*11)%1<0.6?0.5:0.1)) : 1) * (1-solid);
    X.globalAlpha=a; X.fillStyle=p.c;
    X.fillRect(p.x-p.s/2, p.y-p.s/2, p.s, p.s);
  }
  X.globalAlpha=1;
}

/* ============================================================
   ジェネレーター
   ============================================================ */
const G={sweet:72,salt:16,spicy:6,sour:58,umami:12,hard:28,crisp:20,creamy:62,grain:56,form:'pillow'};
let genPts=null, genPhase=null, genSize=null, genCanvas=null;
const COL={sweet:[255,92,147],salt:[30,111,217],spicy:[232,42,30],sour:[245,197,24],umami:[122,75,34]};

function silhouette(f){
  switch(f){
    case"cup":   return"M60,32 L140,32 L123,172 L77,172 Z";
    case"box":   return"M52,26 L148,26 L148,174 L52,174 Z";
    case"stick": return"M82,18 L118,18 L118,182 L82,182 Z";
    case"pillow":return"M28,72 L58,58 L142,58 L172,72 L172,128 L142,142 L58,142 L28,128 Z";
    case"tube":  return"M72,26 L128,26 A16,16 0 0 1 128,42 L128,158 A16,16 0 0 1 128,174 L72,174 A16,16 0 0 1 72,158 L72,42 A16,16 0 0 1 72,26 Z";
    default:{    // bag（上下ギザ）
      const x0=36,x1=164,yT=42,yB=158,t=10,w=(x1-x0)/t;
      let d=`M${x0},${yT+9}`;
      for(let i=0;i<t;i++) d+=` L${x0+w*(i+.5)},${yT} L${x0+w*(i+1)},${yT+9}`;
      d+=` L${x1},${yB-9}`;
      for(let i=t;i>0;i--) d+=` L${x0+w*(i-.5)},${yB} L${x0+w*(i-1)},${yB-9}`;
      return d+" Z";
    }
  }
}
/* 数値 → 図形 → 粒子。形はプログラムが決める（AIではない）。 */
function buildGenerated(){
  const S=240, off=document.createElement('canvas'); off.width=off.height=S;
  const o=off.getContext('2d',{willReadFrequently:true});
  o.scale(S/200,S/200);
  const p=new Path2D(silhouette(G.form));
  o.save(); o.clip(p);

  const TA=['sweet','salt','spicy','sour','umami'];
  const tw=TA.map(k=>Math.max(isFinite(G[k])?G[k]:0,0)), tS=tw.reduce((a,b)=>a+b,0)||1;
  const C=k=>{const c=COL[k];return 'rgb('+c[0]+','+c[1]+','+c[2]+')'};
  const mixCol=(a,b,t)=>{const x=COL[a],y=COL[b];
    return 'rgb('+Math.round(x[0]+(y[0]-x[0])*t)+','+Math.round(x[1]+(y[1]-x[1])*t)+','+Math.round(x[2]+(y[2]-x[2])*t)+')'};

  /* --- 1. 色場：甘さと塩の比率で、面の分割位置が動く --- */
  const sw=G.sweet, sl=G.salt, split=200*(sw/(sw+sl+1));
  const g1=o.createLinearGradient(0,0,0,200);
  g1.addColorStop(0, C(sw>=sl?'sweet':'salt'));
  g1.addColorStop(Math.max(0.05,Math.min(0.95,split/200)), mixCol(sw>=sl?'sweet':'salt', sw>=sl?'salt':'sweet',0.5));
  g1.addColorStop(1, C(sw>=sl?'salt':'sweet'));
  o.globalAlpha=0.16; o.fillStyle=g1; o.fillRect(0,0,200,200); o.globalAlpha=1;

  /* --- 2. 主構造：食感3軸がそれぞれ別の造形規則を持ち、重みで重なる --- */
  const gg=isFinite(G.grain)?G.grain:50;
  const unit = 6 + Math.pow(gg/100,1.25)*44;      // ひと粒の大きさが全構造のスケールを決める

  // パリパリ = 水平の層
  const nCrisp = Math.round(G.crisp/100 * (200/Math.max(unit*0.55,4)));
  for(let i=0;i<nCrisp;i++){
    const y=(i+0.5)*(200/Math.max(nCrisp,1));
    const h=Math.max(1.4, unit*0.22*(0.6+Math.random()*0.8));
    let r=Math.random()*tS,ci=0; for(let j=0;j<5;j++){ci=j;r-=tw[j];if(r<=0)break;}
    o.fillStyle=C(TA[ci]); o.globalAlpha=0.85;
    o.fillRect(-4+Math.random()*8, y-h/2, 208, h);
  }
  // ザクザク = 角のある破片
  const nHard=Math.round(G.hard/100 * 4200/(unit*unit) * 26);
  for(let i=0;i<nHard;i++){
    const cx=Math.random()*200, cy=Math.random()*200, sz=unit*(0.5+Math.random()*0.75);
    let r=Math.random()*tS,ci=0; for(let j=0;j<5;j++){ci=j;r-=tw[j];if(r<=0)break;}
    o.fillStyle=C(TA[ci]); o.globalAlpha=0.95;
    o.save(); o.translate(cx,cy); o.rotate(Math.random()*6.283);
    o.beginPath(); o.moveTo(-sz/2,sz/2); o.lineTo(sz/2,sz*0.28); o.lineTo(sz*0.1,-sz/2); o.closePath(); o.fill();
    o.restore();
  }
  // クリーミー = 丸い塊が寄り集まる
  const nCream=Math.round(G.creamy/100 * 4200/(unit*unit) * 22);
  for(let i=0;i<nCream;i++){
    const cx=Math.random()*200, cy=Math.random()*200, rr=unit*(0.34+Math.random()*0.5);
    let r=Math.random()*tS,ci=0; for(let j=0;j<5;j++){ci=j;r-=tw[j];if(r<=0)break;}
    o.fillStyle=C(TA[ci]); o.globalAlpha=0.9;
    o.beginPath(); o.arc(cx,cy,rr,0,6.283); o.fill();
  }
  o.globalAlpha=1;

  /* --- 3. 味の軸ごとの上書き模様 --- */
  // からい = 中心からの放射
  if(G.spicy>4){
    const n=Math.round(G.spicy/100*30);
    o.strokeStyle=C('spicy'); o.lineWidth=Math.max(1,unit*0.10);
    for(let i=0;i<n;i++){ const a=i/n*6.283+0.2;
      o.beginPath(); o.moveTo(100+Math.cos(a)*22,100+Math.sin(a)*22);
      o.lineTo(100+Math.cos(a)*150,100+Math.sin(a)*150); o.stroke(); }
  }
  // すっぱい = 斜めストライプ
  if(G.sour>4){
    const gap=Math.max(5, 42-G.sour*0.34);
    o.strokeStyle=C('sour'); o.lineWidth=Math.max(1.2,unit*0.13); o.globalAlpha=0.75;
    for(let x=-200;x<300;x+=gap){ o.beginPath(); o.moveTo(x,-20); o.lineTo(x+220,220); o.stroke(); }
    o.globalAlpha=1;
  }
  // うまい = 同心のリング
  if(G.umami>4){
    const n=Math.round(G.umami/100*9);
    o.strokeStyle=C('umami'); o.lineWidth=Math.max(1.2,unit*0.11); o.globalAlpha=0.7;
    for(let i=1;i<=n;i++){ o.beginPath(); o.arc(100,100,i*(95/n),0,6.283); o.stroke(); }
    o.globalAlpha=1;
  }
  o.restore();
  o.strokeStyle='#0d1117'; o.lineWidth=3.2; o.stroke(p);

  /* --- 4. 出来た図形を粒子に翻訳する --- */
  const d=o.getImageData(0,0,S,S).data, pts=[];
  for(let y=0;y<S;y+=2)for(let x=0;x<S;x+=2){
    const i=y*S+x;
    if(d[i*4+3]>40) pts.push([x/S-0.5, y/S-0.5, d[i*4],d[i*4+1],d[i*4+2]]);
  }
  while(pts.length>2600) pts.splice((Math.random()*pts.length)|0,1);
  genCanvas=off;
  genPts=pts;
  genPhase=pts.map(()=>Math.random());
  genSize=pts.map(()=>rnd(1.0,2.8));
}

const RV_SLOW=2.55, RV_BURST=3.45;      // 真珠が漂う区間 / 破裂の始まり（動画内の秒数）

/* 真珠が散ったあと、画面が静かに白へ満ちる。
   1秒ほど白のまま置いて、白が引いた時にはお菓子も文字ももう出来上がっている。
   図案は入れない。白の不透明度が下がるだけ。 */

function drawFlash(dt){
  if(rvFlash<=0) return;
  rvFlash+=dt;                                     // ここでは経過時間として使う
  const t=rvFlash;
  let a;
  if(t<RVP.wIn)              a=Math.pow(t/RVP.wIn, 1.35);
  else if(t<RVP.wIn+RVP.wHold) a=1;
  else                       a=1-Math.pow(Math.min(1,(t-RVP.wIn-RVP.wHold)/RVP.wOut), 0.80);
  if(a<=0){ rvFlash=0; $('veil').style.opacity='0'; return; }
  $('veil').style.opacity=a.toFixed(3);
}
const TASTE_HUE={sweet:335, salt:208, spicy:12, sour:52, umami:38};
function hsl2rgb(h,sl,l){
  h=((h%360)+360)%360/360;
  const q=l<0.5? l*(1+sl) : l+sl-l*sl, p=2*l-q;
  const f=t=>{ t=(t+1)%1;
    return t<1/6? p+(q-p)*6*t : t<1/2? q : t<2/3? p+(q-p)*(2/3-t)*6 : p; };
  return [Math.round(f(h+1/3)*255),Math.round(f(h)*255),Math.round(f(h-1/3)*255)];
}
/* 色はシャボン膜のパステル。クレヨンの虹（＝色相を等間隔に一周させる）にすると
   途端に子どもの絵になるので、色相は「使う色だけ」を並べた環にする。
   青・薄紫・桃・生成り・若草だけを通り、赤と橙と純緑は通らない。
   彩度は 0.10〜0.30 と低く、明度は 0.78〜0.92 と高く保つ（＝淡い）。
   ところどころだけ彩度と明度を強めて、膜の厚みが変わったような濃淡を作る。 */
const RV_HUES=[                    // 通る色だけを環にする
  { h:200, s:0.46, l:0.845 },       // 水色
  { h:222, s:0.44, l:0.855 },       // 青
  { h:258, s:0.40, l:0.865 },       // 薄紫
  { h:292, s:0.36, l:0.875 },       // 藤
  { h:330, s:0.42, l:0.865 },       // 桃
  { h:352, s:0.38, l:0.875 },       // 淡紅
  { h: 38, s:0.44, l:0.875 },       // 生成り
  { h: 62, s:0.38, l:0.870 },       // 淡黄
  { h:110, s:0.30, l:0.870 },       // 若草
  { h:168, s:0.36, l:0.860 },       // 水緑
];
let rvHue0=0;
const RV_NC=140;                                   // 色の段数
function rvBuildCols(){
  const TA=['sweet','salt','spicy','sour','umami'];
  const w=TA.map(k=>Math.max(G[k],0)), S=w.reduce((a,b)=>a+b,0)||1;
  // 味の比率で色相の重心を出し、環のどこから始めるかを決める
  let sx=0, sy=0;
  for(let j=0;j<5;j++){ const an=TASTE_HUE[TA[j]]*Math.PI/180, ww=w[j]/S;
    sx+=Math.cos(an)*ww; sy+=Math.sin(an)*ww; }
  const centre=((Math.atan2(sy,sx)*180/Math.PI)+360)%360;
  let best=0, bd=1e9;
  for(let k=0;k<RV_HUES.length;k++){
    const d=Math.abs(((RV_HUES[k].h-centre+540)%360)-180);
    if(d<bd){ bd=d; best=k; }
  }
  rvHue0=best;
  rvCols=[];
  const N=RV_HUES.length;
  for(let i=0;i<RV_NC;i++){
    const u=i/RV_NC*(N*RVP.hueSpan), k=(Math.floor(u)+best)%N, k2=(k+1)%N, f=u-Math.floor(u);
    const A=RV_HUES[k], B=RV_HUES[k2];
    let hd=B.h-A.h; if(hd>180) hd-=360; if(hd<-180) hd+=360;
    let h=A.h+hd*f, sat=(A.s+(B.s-A.s)*f)*RVP.sat, lit=(A.l+(B.l-A.l)*f)*RVP.lit;

    const c=hsl2rgb(h, Math.max(0.04,Math.min(0.58,sat)), Math.max(0.52,Math.min(0.96,lit)));
    rvCols.push('rgb('+c[0]+','+c[1]+','+c[2]+')');
  }
  // ピクセル直書き用に 0xAABBGGRR を前計算しておく
  rvColU32=new Uint32Array(rvCols.length);
  for(let i=0;i<rvCols.length;i++){
    const m=rvCols[i].match(/(\d+),(\d+),(\d+)/);
    rvColU32[i]=((+m[3])<<16)|((+m[2])<<8)|(+m[1]);
  }
}
/* 位置 → 色の段。波を重ねると縞や痣のような模様が出て、
   上から色を塗ったように見えてしまう。斜めのグラデーション一本だけにする。 */
function rvColAt(x,y){
  let t=(x*0.62 + y*0.38);                 // 左上から右下へ、ゆるやかに一度だけ渡る
  t=0.06+t*0.88;
  if(t<0) t=0; else if(t>1) t=1;
  return Math.min(RV_NC-1,(t*RV_NC)|0);
}
/* 動画1フレーム → 各セルの濃さ。フレームごとに明暗の幅を自動で伸ばす */
function rvSample(v){
  try{
    RVX.drawImage(v,0,0,RVW,RVH);
    const d=RVX.getImageData(0,0,RVW,RVH).data;
    let lo=255;
    for(let i=0,p=0;i<rvField.length;i++,p+=4){
      const l=d[p]*0.30+d[p+1]*0.59+d[p+2]*0.11;
      if(l<lo) lo=l;
      rvField[i]=l;
    }
    const span=255-lo;
    if(span<10){ rvField.fill(0); return; }              // ほぼ真っ白のフレーム
    const inv=1/span;
    /* 素材の下端には床の影が写り込んでいる。16:9では真珠の影として成立するが、
       縦画面では本体から切り離れた帯に見えるので、下7%をなだらかに落とす */
    const fadeFrom=Math.floor(RVH*0.93);
    for(let i=0,p=0;i<rvField.length;i++,p+=4){
      const r=d[p],g=d[p+1],b=d[p+2];
      const mx=r>g?(r>b?r:b):(g>b?g:b), mn=r<g?(r<b?r:b):(g<b?g:b);
      let c=(255-rvField[i])*inv + ((mx-mn)/255)*1.2;    // 暗さ（正規化済み）＋彩度
      c=(c-0.135)*1.156;                                 // 白地のノイズを切り、残りを伸ばす
      const row=(i/RVW)|0;
      if(row>=fadeFrom) c*=1-(row-fadeFrom)/(RVH-fadeFrom);
      rvField[i]= c<=0 ? 0 : (c>=1 ? 1 : Math.pow(c,0.66));
    }
  }catch(e){ rvOk=false; rvField.fill(0); }
}
let rvSig='';
/* 粒子の骨格を組む。位置・色番号・層・読み取りセルは答えに依存しないので、
   質問中に先に作っておける。押した瞬間にこれをやると12万粒ぶん画面が固まる。 */
function rvBuildField(){
  const gW = W<820 ? Math.round(RVP.grid*0.62) : RVP.grid;
  const sig=[gW,W,H,RVP.L.map(l=>l.n+'/'+l.sp).join(',')].join('|');
  if(sig===rvSig && rvPA) return false;
  rvSig=sig;
  RGW=gW|0; RGH=Math.round(gW*9/16);
  const NG=RGW*RGH;
  const cnt=RVP.L.map(l=>Math.max(0,(NG*l.n)|0));
  const N=cnt.reduce((x,y)=>x+y,0);
  rvEnsureBuf();
  rvHX=new Float32Array(N); rvHY=new Float32Array(N);
  rvPX=new Float32Array(N); rvPY=new Float32Array(N); rvPA=new Float32Array(N);
  rvPH=new Float32Array(N); rvPHq=new Uint8Array(N); rvPC=new Uint16Array(N); rvPF=new Int32Array(N);
  rvTH=new Float32Array(N); rvLV=new Uint8Array(N); rvBV=new Float32Array(N);
  const gauss=()=>(Math.random()+Math.random()+Math.random()+Math.random()+Math.random()+Math.random()-3);
  let i=0;
  for(let l=0;l<3;l++){
    const n=cnt[l], sp=RVP.L[l].sp;
    if(!n) continue;
    const stride=NG/n;
    for(let k=0;k<n;k++){
      const cell=(k*stride)|0, cx=cell%RGW, cy=(cell/RGW)|0;
      let hx=(cx+0.12+Math.random()*0.76)/RGW;
      let hy=(cy+0.12+Math.random()*0.76)/RGH;
      if(sp>0){ hx+=gauss()*sp/RGW; hy+=gauss()*sp/RGH; }
      hx=hx<0?0:hx>0.9999?0.9999:hx; hy=hy<0?0:hy>0.9999?0.9999:hy;
      rvHX[i]=hx; rvHY[i]=hy;
      rvPC[i]=rvColAt(hx,hy);
      rvPH[i]=Math.random(); rvPHq[i]=(rvPH[i]*64)|0;
      rvTH[i]=Math.random(); rvLV[i]=l;
      rvPF[i]=((hy*RVH)|0)*RVW + ((hx*RVW)|0);
      i++;
    }
  }
  return true;
}
function revealStart(){
  const nb=nearest(1)[0], maxD=Math.sqrt(9*100*100);
  rvRare = Math.min(100, Math.round(nb.dist/maxD*100*3.0));   // ＝空白度。これが「レア度」
  rvT=0; rvOn=true; rvWaiting=false; rvIntro=0.62; rvSwirl=0;
  rvBuildCols();                                  // 色は味で変わるので毎回。140段だけなので軽い
  rvBuildField();                                 // 未構築か、寸法が変わった時だけ組み直す
  rvField.fill(0); rvBurstOn=false; rvStreamT=0;
  const b=$('qMake').getBoundingClientRect();
  const bx=(b.left+b.width/2)/W||0.5, by=(b.top+b.height/2)/H||0.5, br=(b.width*0.5)/W||0.11;
  const N=rvPA.length;
  for(let i=0;i<N;i++){                            // 初期位置と濃さを戻すだけ
    const an=Math.random()*6.283, rr=br*(0.8+Math.random()*0.55);
    rvPX[i]=bx+Math.cos(an)*rr; rvPY[i]=by+Math.sin(an)*rr*(W/H);
    rvPA[i]=0; rvBV[i]=0;
  }
  const v=$('rvVid');
  if(v){ try{ v.pause(); v.currentTime=0; v.playbackRate=0.90; }catch(e){} }
}
function revealDraw(dt){
  if(!rvOn) return true;
  rvT+=dt;
  const v=$('rvVid');

  // ① 輪から画面全体へ拡散。その間、動画は1枚目で止めて絵だけ出しておく
  if(rvIntro>0){
    rvIntro-=dt;
    if(v && v.readyState>=2) rvSample(v);
    const k=1-Math.pow(0.0016,dt);
    if(rvPX) for(let i=0;i<rvPX.length;i++){ rvPX[i]+=(rvHX[i]-rvPX[i])*k; rvPY[i]+=(rvHY[i]-rvPY[i])*k; }
    if(rvIntro<=0){
      if(rvPX) for(let i=0;i<rvPX.length;i++){ rvPX[i]=rvHX[i]; rvPY[i]=rvHY[i]; }
      if(v) try{ v.playbackRate=0.16; v.play().catch(()=>{}); }catch(e){}
    }
    rvRender(dt, -1);
    return false;
  }
  if(!v || v.readyState<2){ rvRender(dt,-1); return false; }
  const ct=v.currentTime;

  // ② 再生速度。画像が届いているかだけで決める
  if(!rvScrub){
    let rate;
    if(ct>=RV_BURST)      rate=RVP.rBurst;
    else if(ct>=RV_SLOW)  rate=aiImg?RVP.rVortex:0.20;
    else if(ct<0.42)      rate=0.16+(ct/0.42)*(RVP.rVortex-0.16);
    else                  rate=RVP.rVortex;
    rvWaiting = !aiImg && ct>=RV_SLOW;
    if(Math.abs(v.playbackRate-rate)>0.01) v.playbackRate=rate;
    if(v.paused && ct<v.duration-0.06) v.play().catch(()=>{});
  }

  rvSample(v);
  rvRender(dt, ct);
  if(rvFlash<=0 && (ct>=v.duration-RV_FLASH || (aiImg && rvBurstOn && rvStreamT>=RVP.stream-0.25))){ rvFlash=0.0001; gShow=1; gResult(); }
  drawFlash(dt);
  // 白が満ちきったら、動画の残りは待たずにここで演出を終える。
  // 画面が全部白いこの瞬間が、画像と文字を同時に仕込める唯一のカット点
  if(rvFlash>=RVP.wIn && rvOn){ rvOn=false; gStep='RESULT'; try{v.pause();}catch(e){} return true; }
  // duration は読み込みによって 6.00 と報告される回があるが、再生は 5.9167 で止まる。
  // 差分だけで判定すると終了を取りこぼし、演出が終わらないまま固まる。ended を併用する
  if(!rvScrub && (v.ended || ct>=v.duration-0.06)){ rvOn=false; gStep='RESULT'; try{v.pause();}catch(e){} return true; }
  return false;
}
function rvRender(dt, ct){
  if(!rvPA) return;
  rvEnsureBuf();
  const bw=rvBW, bh=rvBH, buf=rvBuf32;
  buf.fill(0);
  /* 粒子の座標は 16:9 の映像に対する比率。画面へ等倍で貼ると、縦長の画面では
     そのぶん縦に引き伸ばされる。比を保ったまま画面を覆う矩形へ写す */
  const SRC_AR=16/9;
  let dw,dh;
  if(bw/bh > SRC_AR){ dw=bw; dh=bw/SRC_AR; }

    /* 縦画面で高さに合わせると、16:9が横に3.9倍はみ出して渦の真ん中しか映らない。

    dw=bw*RVP.fitZ; dh=dw/SRC_AR;

     目の前を横切る時。破裂の瞬間に各粒へ速度係数を配り、指数加速＋ストリークで飛ばす。 */
  const bt = (!intro && ct>RV_BURST) ? (ct-RV_BURST) : 0;

  if(bt>0 && !rvBurstOn){
    rvBurstOn=true; rvStreamT=0;
    for(let i=0;i<N;i++){
      if(rvPA[i]<=0.012){ rvBV[i]=0; continue; }
      const u=Math.random();
      rvBV[i]=0.30+u*u*RVP.blowVar;          // 二乗で偏らせる：大半は奥、ひと握りが手前を横切る
      const dx=rvPX[i]-RVCX, dy=rvPY[i]-RVCY;
      if(dx*dx+dy*dy<0.0004){                // 中心ど真ん中の粒は向きが決まらないので散らす
        const an=Math.random()*6.283;
        rvPX[i]=RVCX+Math.cos(an)*0.02; rvPY[i]=RVCY+Math.sin(an)*0.02;
      }
    }

      if(a<=0.008) continue;

    const fl=FLT[(lv<<6)+rvPHq[i]];

    // 上げると色が薄く見えるので、いまは 0（＝散らさない）に戻してある

    // false … 平方根の階調（淡い側を持ち上げ、濃い側を残す）
    const LY=RVP.L[lv];
    let al = fl*LY.a;
    const A=(al*255)|0; if(A<12) continue;

    const py=(oyb + rvPY[i]*dh + fcos(T*2.1+rvPH[i]*23)*1.5)|0;
    if(px<0||py<0||px>=bw||py>=bh) continue;
    const col=rvColU32[rvPC[i]] | (A<<24);
    const o=py*bw+px;
    if((buf[o]>>>24)<A) buf[o]=col;
    const z=LY.z|0;
    if(z>1){                                   // 粒の一辺。1pxだと面積が減り、面として薄くなる
      const x1=px+z<bw?px+z:bw, y1=py+z<bh?py+z:bh;
      for(let yy=py;yy<y1;yy++){ const row=yy*bw;

const qmix=(a,b,t)=>'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')+')';

/* 6回のタップから9軸すべてとパッケージ形態を決める。
   1問が両極なので、1タップで2つの値が同時に動く。 */
function deriveRest(){
  const t = i => (qAns[i]===undefined?4:qAns[i])/(NLV-1);   // 0=左 … 1=右
  const R = v => Math.round(Math.max(0,Math.min(100,v)));
  const t0=t(0), t1=t(1), t2=t(2), t3=t(3), t4=t(4);

  // 01 あまい / しょっぱい
  G.sweet = R((1-t0)*88 + 8);
  G.salt  = R(t0*88 + 8);
  // 04 途中で変わる ＝ 味が動く。酸味と辛みはそこから出す
  G.sour  = R(t3*70 + 6);
  G.spicy = R(t3*t0*80);
  // 03 手が止まらない ＝ 後を引く旨み
  G.umami = R(t2*80 + 6);

  // 02 ザクザク / とろける
  let hard=(1-t1)*92+6, creamy=t1*92+6, crisp=(1-Math.abs(t1-0.5)*2)*70+10;
  const sum=hard+creamy+crisp;
  G.hard=R(hard/sum*100); G.creamy=R(creamy/sum*100); G.crisp=100-G.hard-G.creamy;

  // 03 ひと口で終わる ＝ 大きい / 手が止まらない ＝ 小粒
  G.grain = R(94 - t2*86);
  // 05 みんなで ＝ 賑やかな意匠。04 味が動くほど色数も増える
  G.deco  = R(8 + t4*58 + t3*26);

  // 形も答えから決まる。ここも来場者には訊かない
  if(t2<0.28)                       G.form = t1>0.55 ? 'cup'  : 'box';
  else if(t2>0.72)                  G.form = t4>0.5  ? 'bag'  : 'pillow';
  else if(t1>0.66)                  G.form = 'tube';
  else if(t1<0.34)                  G.form = 'stick';
  else                              G.form = t4>0.5 ? 'bag' : 'box';
}

/* オーブのまわりに電子をびっしり散らす。押した瞬間は外へ弾ける。 */
let orbFx=[];
function orbBurst(id){
  const b=$(id); if(!b) return;
  const r=b.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  for(let i=0;i<380;i++){
    const a=Math.random()*6.283, v=rnd(160,760);
    orbFx.push({x:cx+fcos(a)*r.width*0.45, y:cy+fsin(a)*r.width*0.45,
      vx:fcos(a)*v, vy:fsin(a)*v*0.85, life:1, s:rnd(1,3.2),
      c: Math.random()<0.42 ? NOISE[(Math.random()*NOISE.length)|0] : '#0d1117'});
  }
}
function drawOrbFx(dt){
  for(let i=orbFx.length-1;i>=0;i--){
    const p=orbFx[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.94; p.vy*=0.94; p.life-=dt*0.85;
    if(p.life<=0){ orbFx.splice(i,1); continue; }
    X.globalAlpha=Math.max(0,p.life)*0.9; X.fillStyle=p.c;
    X.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);
  }
  X.globalAlpha=1;
}
function orbDust(){
  const id = gStep==='INTRO' ? 'orbStart' : gStep==='READY' ? 'qMake' : null;
  if(!id) return;
  const b=$(id); if(!b.classList.contains('on')) return;
  const r=b.getBoundingClientRect(); if(!r.width) return;
  const cx=r.left+r.width/2, cy=r.top+r.height/2, R=r.width*0.5;
  for(let i=0;i<560;i++){                              // かなりの量を散りばめる
    const ph=(i*0.61803)%1, ph2=(i*0.7548)%1;
    const f=(T*4.2+ph*11)%1; if(f>0.62) continue;
    const a=ph*6.283 + T*(0.18+ph2*0.35);
    const rad=R*(0.62 + ph2*1.05) + fsin(T*2.2+ph*9)*R*0.07;
    const z=0.8+((i*13)%4)*0.55;
    X.globalAlpha=(f<0.34?0.85:0.35)*(1-ph2*0.45);
    X.fillStyle=((i%11)===0)?NOISE[i%5]:(ph2<0.45?'#0d1117':'rgba(20,40,80,.55)');
    X.fillRect(cx+fcos(a)*rad-z/2, cy+fsin(a)*rad*0.98-z/2, z, z);
  }
  X.globalAlpha=1;
}
/* 選択中の円のまわりに粒子を散らす（canvasにDOMの位置を合わせて描く） */
/* 押した瞬間に、その丸から粒が散る。
   触った手応えが何もないと、9個並んだ丸はただの回答欄にしか見えない。 */
let qFx=[];
function qBurstAt(el, col){
  const r=el.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  for(let i=0;i<34;i++){
    const a=Math.random()*6.283, sp=40+Math.random()*190;
    qFx.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,
      life:0,max:0.55+Math.random()*0.4,z:1.4+Math.random()*2.6,
      c: Math.random()<0.72 ? col : NOISE[i%5]});
  }
  if(qFx.length>400) qFx=qFx.slice(-400);
}
function drawQFx(dt){
  if(!qFx.length) return;
  for(const p of qFx){
    p.life+=dt; p.vy+=520*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.94;
    const k=1-p.life/p.max; if(k<=0) continue;
    X.globalAlpha=Math.max(0,k)*0.9; X.fillStyle=p.c;
    X.fillRect(p.x-p.z/2, p.y-p.z/2, p.z, p.z);
  }
  X.globalAlpha=1;
  qFx=qFx.filter(p=>p.life<p.max);
}
function qBurst(){
  if(MODE!=='GEN'||qDone||rvOn||qSel<0) return;
  const box=$('qCircles'); if(!box||!box.children[qSel]) return;
  const r=box.children[qSel].getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2, R=r.width;
  for(let i=0;i<120;i++){
    const ph=(i*0.61803)%1, a=ph*6.283+T*0.5;
    const f=(T*6+ph*11)%1; if(f>0.55) continue;
    const rad=R*(0.55+((i*0.7548)%1)*1.15)+Math.sin(T*3+ph*9)*3;
    X.globalAlpha=0.55*(1-((i*0.37)%1)*0.5);
    X.fillStyle=NOISE[i%5];
    const z=1+((i*13)%3)*0.7;
    X.fillRect(cx+Math.cos(a)*rad-z/2, cy+Math.sin(a)*rad*0.9-z/2, z, z);
  }

}

/* 紹介文は必ず「<発明>、<味>の<種類>です。……」の形で始まる。
   最初の句点までを取り、その中の最後の読点で切ると、前半が発明そのものになる。
   ここを本文に埋もれさせると「何が新しいのか」が読み飛ばされるので、独立した行に立てる。
   形が合わないとき（AI生成文・エラー文）は、黙って元の文をそのまま出す。 */
function splitNew(t){
  const s=String(t||''); const i=s.indexOf('。');
  if(i<0) return null;
  const first=s.slice(0,i), rest=s.slice(i+1);
  const c=first.lastIndexOf('、');
  if(c<1 || first.length-c<3) return null;
  return { nw:first.slice(0,c)+'。', body:first.slice(c+1)+'。'+rest };
}

  document.querySelector('.qhead').style.opacity='0';
  orbShow('orbStart');
}
$('orbStart').onclick=()=>{
  if(gStep!=='INTRO') return;
  gStep='ASK'; orbBurst('orbStart');           // 押した瞬間に粒子が弾ける
  orbHide('orbStart');
  try{ rvBuildCols(); rvBuildField(); }catch(e){}   // 押す前に作っておく
  setTimeout(()=>{
    document.querySelector('.qhead').style.transition='opacity .9s';
    document.querySelector('.qhead').style.opacity='1';
    $('qWrap').style.display=''; qRender();
  },560);
};
function buildGenUI(){
  const g=$('genPanel'); g.innerHTML='';
  AXES.forEach((a,k)=>{
    const el=document.createElement('div'); el.className='s';
    el.innerHTML='<div class="l"><span>'+AXJA[k]+'</span><b class="mono" id="gv_'+a+'">'+G[a]+'</b></div>'+
                 '<input type="range" min="0" max="100" value="'+G[a]+'" id="gs_'+a+'">';
    g.appendChild(el);
    el.querySelector('input').addEventListener('input',e=>{
      G[a]=+e.target.value; document.getElementById('gv_'+a).textContent=G[a];
      buildGenerated(); refreshGen(); requestAI();
    });
  });
  const rw=document.createElement('div'); rw.className='s'; rw.style.gridColumn='1/-1';
  rw.innerHTML='<button class="btn" id="btnRegen" style="padding:7px 14px;font-size:10.5px">AIで作り直す</button>';
  g.appendChild(rw);
  rw.querySelector('button').onclick=()=>{ aiCache.delete(gSeed()); aiImg=null; requestAI(true); };
  const fw=document.createElement('div'); fw.className='s'; fw.style.gridColumn='1/-1';
  fw.innerHTML='<div class="l"><span>パッケージ形態</span></div><div id="gForms" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px"></div>';
  g.appendChild(fw);
  Object.keys(FORMJA).forEach(f=>{
    const b=document.createElement('button'); b.className='btn'; b.style.padding='6px 11px'; b.style.fontSize='10px';
    b.textContent=FORMJA[f]; b.dataset.f=f;
    b.onclick=()=>{G.form=f;buildGenerated();refreshGen();requestAI();};
    fw.querySelector('#gForms').appendChild(b);
  });
}

/* ============================================================
   入力
   ============================================================ */
function onTap(mx,my){
  if(my>H-96) return;      // 下部のCTA帯は無視
  if(MODE==='DETAIL'){ closeDetail(); return; }
  if(MODE!=='FLOAT') return;
  for(let i=snacks.length-1;i>=0;i--){
    if(snacks[i].hit(mx,my)){ openDetail(snacks[i]); return; }
  }
  startConcept();
}
C.addEventListener('pointerdown',e=>onTap(e.clientX,e.clientY));
$('pClose').onclick=e=>{e.stopPropagation();closeDetail();};
$('btnGen').onclick=e=>{e.stopPropagation();startConcept();};
/* 待機画面まで一気に戻す。もどるの終点 */
function toFloat(){
  $('ov').classList.remove('on'); kinOn=false; $('genui').classList.remove('on'); $('genui').classList.remove('ready'); $('cta').style.display='';
  $('panel').classList.remove('on');
  $('btnBack').style.display='none';
  MODE='FLOAT'; selected=null; document.body.classList.remove('genmode');
  rvOn=false; try{ $('rvVid').pause(); }catch(e){}
  for(const s of snacks){ s.esc=0; s.talpha=1; s.tdisp=1; s.terode=1; s.tw=s.baseW; }
  layout();
}
/* もどるは「1つ前」へ。
   5問目で押し間違えた人が最初からやり直しになるのは、展示では致命的。 */
$('btnBack').onclick=e=>{
  e.stopPropagation();
  if(MODE==='DETAIL'){ closeDetail(); return; }
  if(MODE==='CONCEPT'){
    if(page>0){ page--; showPage(); } else toFloat();
    return;
  }
  if(MODE==='GEN'){
    // 結果・生成中 → 最後の質問へ。引いたお菓子は捨てて引き直させる
    if(gStep==='RESULT'||gStep==='REVEAL'){
      rvOn=false; try{ $('rvVid').pause(); $('rvVid').currentTime=0; }catch(e){}
      packItem=null; aiImg=null; aiErr=''; $('gNew').hidden=true;
      $('genui').classList.remove('ready'); $('veil').style.opacity='0'; rvFlash=0; gShow=0;
      gStep='ASK'; qDone=false; qIdx=Q.length-1; qSel=qAns[qIdx];
      ['orbStart','qMake'].forEach(i=>$(i).classList.remove('on','show','go'));
      $('qWrap').style.display=''; document.querySelector('.qhead').style.opacity='1';
      qRender(-1);
      return;
    }
    // 「つくりだす」待ち → 最後の質問へ
    if(gStep==='READY'){
      orbHide('qMake'); gStep='ASK'; qDone=false; qIdx=Q.length-1; qSel=qAns[qIdx];
      $('qWrap').style.display=''; qRender(-1);
      return;
    }
    // 質問中 → 1問前へ。先頭ならコンセプトの最後の画面へ
    if(gStep==='ASK'){
      if(qIdx>0){ qIdx--; qSel=qAns[qIdx]; qRender(-1); return; }
      $('genui').classList.remove('on'); document.body.classList.remove('genmode');
      MODE='CONCEPT'; page=PAGES.length-1; startConceptAt(page);
      return;
    }
    // 球体を出しただけ → コンセプトの最後の画面へ
    $('genui').classList.remove('on'); document.body.classList.remove('genmode');
    MODE='CONCEPT'; page=PAGES.length-1; startConceptAt(page);
    return;
  }
  toFloat();
};
$('qMake').onclick=()=>{ if(rvOn||gStep!=='READY') return;
  gStep='REVEAL'; orbHide('qMake');       // ここでは粒子を出さない。押した瞬間に実写へ入る
  $('genui').classList.remove('ready');
  document.querySelector('.qhead').style.opacity='0';
  aiImg=null; aiText=''; requestAI(true); requestAIText(); revealStart(); };
$('qAgain').onclick=()=>{ gStep='INTRO'; qReset(); startGen(); };
$('qBack').onclick=()=>$('btnBack').click();
addEventListener('resize',resize);
addEventListener('keydown',e=>{ if(e.key==='Escape') $('btnBack').click(); });

/* ============================================================
   起動
   ============================================================ */
function boot(){
  if(typeof REVEAL_SRC!=='undefined') $('rvVid').src=REVEAL_SRC;
  const n=Math.min(OKASHI.length, (typeof PARTICLE_DATA!=='undefined'?PARTICLE_DATA.length:54));
  for(let i=0;i<n;i++) if(!OKASHI[i].skip) snacks.push(new Snack(i));   // 見た目が同一の重複は出さない
  resize(); initDust(); 
  snacks.forEach(s=>{
    const im=new Image();
    im.onload=()=>{ s.img=im; loaded++; };
    im.src='images/'+String(s.i+1).padStart(2,'0')+'.jpg';   // 画像は元の通し番号で引く
  });
  requestAnimationFrame(frame);
  // 検証用：?m=detail&i=54 / ?m=concept / ?m=gen で初期状態を指定できる
  const qs=new URLSearchParams(location.search);
  if(qs.get('m')) document.body.classList.add('nofx');
  if(qs.get('m')==='detail') setTimeout(()=>openDetail(snacks[(+qs.get('i')||1)-1]||snacks[0]),900);
  if(qs.get('m')==='concept'){ startConcept(); if(qs.has('seek')) setTimeout(()=>{ showPage(); seekTo(parseFloat(qs.get('seek'))); },60); }
  if(qs.get('m')==='gen'){ startGen(); if(qs.has('seek')) setTimeout(()=>seekTo(parseFloat(qs.get('seek'))),80); }
  if(qs.get('aidebug')){ setTimeout(async()=>{
      try{
        const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_KEY}`,
          {method:'POST',headers:{'Content-Type':'application/json'},
           body:JSON.stringify({contents:[{parts:[{text:'白背景に浮かぶ架空のお菓子のパッケージ。'}]}],
             generationConfig:{responseModalities:["IMAGE"],seed:7}})});
        const d=await r.json();
        const p=(d.candidates?.[0]?.content?.parts||[]).find(x=>x.inlineData);
        document.title='AIDEBUG:'+r.status+':'+(p?'IMG_OK':'NO_IMG')+':'+JSON.stringify(d).slice(0,80);
      }catch(e){ document.title='AIDEBUG:EXC:'+(e&&e.message||e); }
    },300); }
}
/* ============================================================
   調整パネル（Pキー）。★ は粒子を作り直すので「やり直す」で反映される
   ============================================================ */
const TUNE=[
  ['t'],
  ['h','レイヤー1'],
  ['L0a','濃さ',0,1,.01],['L0n','本数 ★',0,2,.05],['L0sp','散らばり ★',0,8,.1],['L0z','粒の大きさ',1,4,1],
  ['h','レイヤー2'],
  ['L1a','濃さ',0,1,.01],['L1n','本数 ★',0,2,.05],['L1sp','散らばり ★',0,8,.1],['L1z','粒の大きさ',1,4,1],
  ['h','レイヤー3'],
  ['L2a','濃さ',0,1,.01],['L2n','本数 ★',0,2,.05],['L2sp','散らばり ★',0,8,.1],['L2z','粒の大きさ',1,4,1],
  ['h','共通'],
  ['grid','格子の細かさ ★',200,900,10],['blink','明滅で出る割合',.3,1,.01],
  ['h','色 ★'],
  ['sat','彩度',.2,2.5,.05],['lit','明度',.6,1.15,.01],['hueSpan','色相の幅',.1,1.6,.02],
  ['h','速度'],
  ['rVortex','渦',.2,1.5,.05],['rBurst','破裂',.2,1.5,.05],
  ['blow','破裂の勢い',.5,8,.1],['blowVar','奥行きのばらつき',0,5,.1],['streak','尾の長さ',0,4,.1],
  ['blowFade','破裂の消え',.2,3,.05],['blowZ','手前の粒の最大倍率',1,8,.5],['stream','後続が流れる秒数',0,4,.1],
  ['h','白'],
  ['wIn','満ちる',.2,3,.05],['wHold','白のまま',0,3,.05],['wOut','引く',.3,4,.05]
];
const fmtP=v=>(v>=100?String(v):v>=10?v.toFixed(1):v.toFixed(2));
const getP=k=>{ const m=k.match(/^L(\d)(.+)$/); return m? RVP.L[+m[1]][m[2]] : RVP[k]; };
const setP=(k,v)=>{ const m=k.match(/^L(\d)(.+)$/); if(m) RVP.L[+m[1]][m[2]]=v; else RVP[k]=v; };
function buildTune(){
  const el=$('tune'); let h='';
  TUNE.forEach(t=>{
    if(t[0]==='t'){
      h+='<div class="tl"><button id="tPlay">▶</button>'
        +'<input type="range" id="tTime" min="0" max="6" step="0.01" value="0">'
        +'<b id="tvTime">0.00</b></div>'
        +'<div class="note" style="margin:2px 0 0">つまむと時間が止まります。★は「やり直す」で反映。</div>';
      return; }
    if(t[0]==='h'){ h+='<h4>'+t[1]+'</h4>'; return; }
    const [k,label,mn,mx,st]=t;
    h+='<div class="r"><span>'+label+'</span><input type="range" data-k="'+k+'" min="'+mn+'" max="'+mx+'" step="'+st+'" value="'+getP(k)+'"><b id="tv_'+k+'">'+fmtP(getP(k))+'</b></div>';
  });
  h+='<div class="btns"><button id="tRe">やり直す</button><button id="tCopy">数値をコピー</button><button id="tReset">初期値</button></div>';
  el.innerHTML=h;
  el.querySelectorAll('input[data-k]').forEach(inp=>{
    inp.oninput=()=>{ const k=inp.dataset.k; setP(k,+inp.value); $('tv_'+k).textContent=fmtP(getP(k)); };
  });
  // ── タイムライン ──
  const v=$('rvVid'), tt=$('tTime');
  tt.max=(v.duration||6).toFixed(2);
  tt.oninput=()=>{ rvScrub=true; rvOn=true; gStep='REVEAL'; rvIntro=0; rvFlash=0; gShow=0;
    $('veil').style.opacity='0'; $('tPlay').textContent='▶';
    $('genui').classList.remove('ready');      // 前回の結果表示が演出に重なるのを防ぐ
    try{ v.pause(); v.currentTime=+tt.value; }catch(e){}
    $('tvTime').textContent=(+tt.value).toFixed(2); };
  $('tPlay').onclick=()=>{
    $('genui').classList.remove('ready');
    if(rvScrub){ rvScrub=false; $('tPlay').textContent='❚❚'; try{ v.play().catch(()=>{}); }catch(e){} }
    else { rvScrub=true; $('tPlay').textContent='▶'; try{ v.pause(); }catch(e){} }
  };
  setInterval(()=>{ if(!$('tune').classList.contains('on')||rvScrub) return;
    const t=$('rvVid').currentTime; tt.value=t; $('tvTime').textContent=t.toFixed(2); },120);
  $('tRe').onclick=()=>{ rvScrub=false; $('tPlay').textContent='❚❚'; rvReplay(); };
  $('tReset').onclick=()=>{
    RVP.L=JSON.parse(JSON.stringify(TUNE_DEF.L));
    Object.keys(TUNE_DEF).forEach(k=>{ if(k!=='L') RVP[k]=TUNE_DEF[k]; });
    syncTune(); rvReplay(); };
  $('tCopy').onclick=()=>{
    const lines=['grid: '+RVP.grid];
    RVP.L.forEach((l,i)=>lines.push('レイヤー'+(i+1)+': 濃さ '+l.a+' / 本数 '+l.n+' / 散らばり '+l.sp+' / 大きさ '+l.z));
    ['blink','sat','lit','hueSpan','rVortex','rBurst','blow','blowVar','streak','blowFade','blowZ','stream','wIn','wHold','wOut'].forEach(k=>lines.push(k+': '+RVP[k]));
    navigator.clipboard.writeText(lines.join('\n')).then(()=>{ $('tCopy').textContent='コピーしました';
      setTimeout(()=>$('tCopy').textContent='数値をコピー',1400); }).catch(()=>{});
  };
}
const TUNE_DEF=JSON.parse(JSON.stringify(RVP));
function syncTune(){
  $('tune').querySelectorAll('input[data-k]').forEach(inp=>{
    const k=inp.dataset.k; inp.value=getP(k); $('tv_'+k).textContent=fmtP(getP(k));
  });
}
/* 演出だけ最初からやり直す。生成物はそのまま使うのでAPIは呼ばない */
function rvReplay(){
  if(MODE!=='GEN') return;
  $('veil').style.opacity='0'; rvFlash=0; gShow=0;
  $('genui').classList.remove('ready');
  document.querySelector('.qhead').style.opacity='0';
  $('qWrap').style.display='none';
  ['orbStart','qMake'].forEach(i=>$(i).classList.remove('on','show','go'));
  gStep='REVEAL'; revealStart();
  const v=$('rvVid'); try{ v.pause(); v.currentTime=0; }catch(e){}
}
addEventListener('keydown',e=>{
  if(e.key!=='p'&&e.key!=='P') return;
  if(/^(INPUT|TEXTAREA)$/.test((e.target||{}).tagName||'')) return;
  const el=$('tune');
  if(!el.innerHTML) buildTune();
  el.classList.toggle('on');
});
window.__dbg=()=>({mode:MODE,step:gStep,rvOn,rvT:+rvT.toFixed(2),ct:+($('rvVid').currentTime||0).toFixed(2),
  rate:$('rvVid').playbackRate,wait:rvWaiting,rvRare,aiImg:!!aiImg,aiMs,aiErr});
boot();
</script>
